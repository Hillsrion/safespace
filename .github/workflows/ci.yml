name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Same distribution/FFmpeg major as the production media processor.
    container: node:22.22.3-trixie
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safespace
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      APP_URL: http://127.0.0.1:5173
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safespace
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safespace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install media processing runtime
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ffmpeg fonts-dejavu-core postgresql-client

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Apply migrations to PostgreSQL
        run: yarn prisma:deploy

      - name: Verify PostgreSQL RLS with a non-owner runtime role
        run: yarn tsx scripts/verify-rls.ts
        env:
          # Used only to create fixtures and the constrained temporary LOGIN.
          # All tested operations connect as that NOBYPASSRLS, non-owner role.
          RLS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safespace
          RLS_TEST_ALLOW_SETUP: "1"

      - name: Verify PostgreSQL backup and restore
        run: yarn db:verify-restore
        env:
          BACKUP_TEST_ALLOW_SETUP: "1"
          BACKUP_TEST_SOURCE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safespace
          BACKUP_TEST_MAINTENANCE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
          BACKUP_TEST_RESTORE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safespace_restore_ci
          BACKUP_TEST_RESTORE_DATABASE_NAME: safespace_restore_ci

      - name: Verify PostgreSQL search query plans
        run: yarn db:verify-search-plans
        env:
          SEARCH_PERF_TEST_ALLOW_SETUP: "1"
          SEARCH_PERF_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safespace
          SEARCH_PERF_TEST_DATABASE_NAME: safespace

      - name: Typecheck and test
        run: yarn run check

      - name: Verify the isolated media deletion worker database boundary
        run: yarn tsx scripts/verify-media-deletion-worker.ts
        env:
          RLS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safespace
          RLS_TEST_ALLOW_SETUP: "1"

      - name: Build production bundles
        run: yarn build
        env:
          NODE_ENV: production

      - name: Verify independent production entrypoints
        run: |
          test -f build/runtime/database.js
          test -f build/runtime/media-deletion-worker.js
          env -u DATABASE_URL -u SESSION_SECRET NODE_ENV=production node build/runtime/media-deletion-worker.js --help

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safespace
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safespace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated migration, worker and non-root web images
        run: |
          docker build --target migrations --tag safespace-migrations:ci .
          docker build --target runtime --tag safespace-web:ci .
          docker build --target media-deletion-worker --tag safespace-worker:ci .
      - name: Apply migrations with the separate owner job
        run: docker run --rm --network host -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/safespace safespace-migrations:ci
      - name: Provision a restricted CI runtime role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d safespace -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE safespace_web LOGIN PASSWORD 'ci-runtime-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE safespace TO safespace_web;
          GRANT USAGE ON SCHEMA public, safespace_private TO safespace_web;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO safespace_web;
          REVOKE ALL ON TABLE public._prisma_migrations FROM safespace_web;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA safespace_private TO safespace_web;
          CREATE ROLE safespace_media_deletion_worker LOGIN PASSWORD 'ci-worker-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE safespace TO safespace_media_deletion_worker;
          GRANT USAGE ON SCHEMA safespace_worker TO safespace_media_deletion_worker;
          GRANT EXECUTE ON FUNCTION safespace_worker.claim_media_deletion_jobs(integer), safespace_worker.complete_media_deletion_job(uuid, uuid), safespace_worker.fail_media_deletion_job(uuid, uuid, text) TO safespace_media_deletion_worker;
          SQL
      - name: Run the built worker with its dedicated restricted role
        run: |
          docker run --rm safespace-worker:ci node build/runtime/media-deletion-worker.js --help
          docker run --rm --network host \
            -e MEDIA_DELETION_WORKER_DATABASE_URL=postgresql://safespace_media_deletion_worker:ci-worker-password@127.0.0.1:5432/safespace \
            safespace-worker:ci node build/runtime/media-deletion-worker.js --once
          test "$(docker run --rm safespace-worker:ci id -u)" != 0
          test "$(docker image inspect safespace-worker:ci --format '{{join .Config.Healthcheck.Test " "}}')" = NONE
      - name: Start the built web image without owner credentials
        run: |
          docker run --detach --name safespace-web --network host \
            -e DATABASE_URL=postgresql://safespace_web:ci-runtime-password@127.0.0.1:5432/safespace \
            -e SESSION_SECRET=ci-only-session-secret-with-at-least-32-characters \
            -e APP_URL=https://safe.example \
            safespace-web:ci
      - name: Verify production startup, public content and private redirects
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/_health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/_health
          curl --fail --silent http://127.0.0.1:3000/community-policy | grep -q 'Charte de conduite'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/dashboard)" = 302
          docker exec safespace-web node server/healthcheck.mjs
          test "$(docker exec safespace-web id -u)" != 0
      - name: Show safe startup diagnostics on failure
        if: failure()
        run: docker logs safespace-web
      - name: Stop CI web container
        if: always()
        run: docker rm --force safespace-web || true
