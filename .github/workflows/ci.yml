name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/safespace
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      APP_URL: http://127.0.0.1:5173
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safespace
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safespace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install media processing runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Apply migrations to PostgreSQL
        run: yarn prisma:deploy

      - name: Verify PostgreSQL RLS with a non-owner runtime role
        run: yarn tsx scripts/verify-rls.ts
        env:
          # Used only to create fixtures and the constrained temporary LOGIN.
          # All tested operations connect as that NOBYPASSRLS, non-owner role.
          RLS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/safespace
          RLS_TEST_ALLOW_SETUP: "1"

      - name: Typecheck and test
        run: yarn run check

      - name: Build production bundles
        run: yarn build
        env:
          NODE_ENV: production
